# Netlify config (for repo-connected deploys)
[build]
  base = "Scaffold"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_SKIP_FRAMEWORK_DETECTION = "true"

# SPA: all routes → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed Vite assets; HTML stays fresh
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/weather/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
